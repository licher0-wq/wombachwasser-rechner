<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b2945"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Wombachwasser"><title>Wombachwasser Rechner</title><style>*{box-sizing:border-box}body{margin:0;background:#e8dcc7;color:#162d43;font-family:Arial,sans-serif}.app{max-width:620px;margin:auto;min-height:100vh;background:#fffaf0;box-shadow:0 0 35px #0002}.hero{background:#f3e6cf;color:#0b2945;text-align:center;overflow:hidden;border-bottom:5px solid #0b2945}.hero svg{display:block;width:100%;height:auto}.heroTitle{font:900 30px Georgia,serif;letter-spacing:2px;margin:-4px 0 18px}.content{padding:16px}.panel{background:#fffaf0;border:1px solid #d7c9b2;border-radius:18px;overflow:hidden;margin:12px 0;box-shadow:0 6px 18px #0001}.head{background:#0b2945;color:#fff;text-align:center;padding:12px;font-weight:800;letter-spacing:1px}.amount{padding:14px}.main{display:grid;grid-template-columns:58px 1fr 58px;gap:10px;align-items:center}.circle{width:58px;height:58px;border:0;border-radius:50%;background:#0b2945;color:white;font-size:30px}.number{text-align:center;border:1px solid #d7c9b2;border-radius:13px;padding:7px}.number b{font-size:42px}.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:12px}.quick button,.custom button{padding:11px 4px;border:1px solid #cbbda7;border-radius:10px;background:#fffaf0;font-weight:700}.custom{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}.custom input{width:100%;padding:12px;border:1px solid #cbbda7;border-radius:10px;background:#fffaf0;font-size:17px}.custom button{background:#0b2945;color:#fff;padding:0 15px}.ingredient{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:14px;border-bottom:1px solid #d7c9b2}.ingredient:last-child{border:0}.icon{font-size:27px;width:48px;height:48px;border-radius:50%;background:#eaf1f5;display:grid;place-items:center}.name{font-weight:900}.sub{font-size:13px;color:#675f54;margin-top:3px}.value{font-weight:900;font-size:20px;text-align:right}.note{padding:12px 14px;background:#f1e8d9;font-size:13px;line-height:1.45}.footer{background:#0b2945;color:#fff;text-align:center;padding:20px}.tag{font:italic 22px Georgia,serif;color:#f5ead6}.small{font-size:11px;letter-spacing:1px;margin-top:8px}@media(min-width:620px){body{padding:20px}.app{border-radius:24px;overflow:hidden}}</style></head><body><div class="app"><header class="hero"><svg viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Wombachwasser Illustration"><rect width="620" height="300" fill="#f3e6cf"/><path d="M0 235 Q150 205 310 235 T620 225 V300 H0Z" fill="#d9c49c"/><path d="M0 255 Q130 225 250 252 T500 245 T620 255 V300 H0Z" fill="#0b2945" opacity=".95"/><g fill="#3e613d" stroke="#29462c" stroke-width="3"><path d="M72 185 C35 145 44 91 82 56 C120 92 117 142 72 185Z"/><path d="M145 184 C116 143 126 91 164 62 C194 103 187 148 145 184Z"/><path d="M535 186 C500 145 511 91 548 57 C585 101 580 146 535 186Z"/><path d="M468 185 C438 143 449 96 486 64 C516 103 510 148 468 185Z"/></g><g fill="#e08a24" stroke="#713b17" stroke-width="4"><circle cx="95" cy="193" r="18"/><circle cx="133" cy="202" r="18"/><circle cx="487" cy="198" r="18"/><circle cx="526" cy="190" r="18"/></g><g fill="#7c9a55" stroke="#425a32" stroke-width="3"><ellipse cx="105" cy="165" rx="18" ry="9" transform="rotate(-25 105 165)"/><ellipse cx="145" cy="176" rx="18" ry="9" transform="rotate(20 145 176)"/><ellipse cx="497" cy="170" rx="18" ry="9" transform="rotate(-20 497 170)"/><ellipse cx="535" cy="164" rx="18" ry="9" transform="rotate(25 535 164)"/></g><g transform="translate(310 132)"><path d="M-82 65 Q-82 0 0 -5 Q82 0 82 65Z" fill="#0b2945"/><path d="M-66 60 Q-62 14 0 10 Q62 14 66 60Z" fill="#f7f0df" stroke="#d0bd99" stroke-width="3"/><path d="M-42 52 Q-35 25 0 22 Q35 25 42 52" fill="none" stroke="#0b2945" stroke-width="7"/><circle cx="-25" cy="43" r="7" fill="#e08a24"/><circle cx="25" cy="43" r="7" fill="#e08a24"/></g><text x="310" y="270" text-anchor="middle" class="heroTitle">WOMBACHWASSER</text></svg></header><main class="content"><div class="panel"><div class="head">GEWÜNSCHTE GESAMTMENGE</div><div class="amount"><div class="main"><button class="circle" onclick="change(-1)">−</button><div class="number"><b id="liters">30</b> Liter</div><button class="circle" onclick="change(1)">+</button></div><div class="quick"><button onclick="setL(5)">5 L</button><button onclick="setL(20)">20 L</button><button onclick="setL(30)">30 L</button><button onclick="setL(50)">50 L</button><button onclick="setL(600)">600 L</button></div><form class="custom" id="form"><input id="custom" type="text" inputmode="decimal" placeholder="Eigene Menge, z. B. 37,5"><button>OK</button></form></div></div><div class="panel"><div class="head">ZUTATEN FÜR <span id="head">30</span> LITER</div><div class="ingredient"><div class="icon">💧</div><div><div class="name">WASSER</div><div class="sub">83 %</div></div><div class="value" id="water">24,90 l</div></div><div class="ingredient"><div class="icon">🥃</div><div><div class="name">KORN</div><div class="sub">13 %</div></div><div class="value" id="korn">3,90 l</div></div><div class="ingredient"><div class="icon">🧃</div><div><div class="name">KRÜMEL-EISTEE</div><div class="sub">400-g-Dosen</div></div><div class="value" id="tea">1.600 g<br><small>= 4 Dosen</small></div></div><div class="note"><b>Grundrezept:</b> 30 l = 24,9 l Wasser + 3,9 l Korn + 1.600 g Krümel-Eistee. Alles wird proportional berechnet.</div></div></div></main><footer class="footer"><div class="tag">EISKALT GENIESSEN</div><div class="small">FRISCH GEMISCHT · VON UNS FÜR UNS</div></footer></div><script>let liters=30;const f=(n,d=2)=>n.toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d});function render(){let x=liters/30,w=24.9*x,k=3.9*x,g=1600*x,c=4*x;document.getElementById('liters').textContent=f(liters,liters%1?1:0);document.getElementById('head').textContent=f(liters,liters%1?1:0);document.getElementById('water').textContent=f(w)+' l';document.getElementById('korn').textContent=f(k)+' l';document.getElementById('tea').innerHTML=f(g,0)+' g<br><small>= '+f(c,2)+' Dosen</small>'}function change(n){liters=Math.max(1,Math.round((liters+n)*10)/10);render()}function setL(n){liters=n;document.getElementById('custom').value='';render()}document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();let n=Number(document.getElementById('custom').value.trim().replace(',','.'));if(!Number.isFinite(n)||n<=0)return alert('Bitte eine gültige Menge eingeben.');liters=n;render()});render();</script></body></html>
